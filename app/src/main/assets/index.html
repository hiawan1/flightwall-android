<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#07111e;color:#e5f4ff;font-family:Arial,sans-serif}header{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;background:#0d2235;border-bottom:1px solid #28435b}main{display:flex;height:calc(100vh - 44px)}#radar{width:62%;position:relative;overflow:hidden;background:radial-gradient(circle at center,#183c4a 0,#102a3c 45%,#081725 100%)}#rings{position:absolute;inset:0;width:100%;height:100%}#planes{position:absolute;inset:0}#center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#4dffb8;font-size:20px}#details{width:38%;padding:12px;background:#0b1b2b;overflow:auto;border-left:1px solid #345}#photo{width:100%;height:34vh;object-fit:cover;background:#183145;border-radius:8px}h2{font-size:19px;margin:10px 0 5px}p{margin:5px 0;color:#b7d3e4;font-size:14px}.plane{position:absolute;font-size:20px;transform:translate(-50%,-50%);color:#66c9ff;text-shadow:0 0 8px #000}.selected{color:#ffe16a;font-size:26px}#status{font-size:12px;color:#7de2b6}.stat{display:flex;justify-content:space-between;border-bottom:1px solid #244;padding:6px 0;font-size:13px}.muted{color:#9db4c8}#count{position:absolute;left:10px;bottom:10px;font-size:12px;color:#b4c7d9}
</style></head><body><header><strong>✈ FLIGHT WALL · 33173</strong><span id="status">Connecting…</span></header><main><section id="radar"><svg id="rings" viewBox="0 0 100 100" preserveAspectRatio="none"><circle cx="50" cy="50" r="46" stroke="#33647a" stroke-width=".3" fill="none"/><circle cx="50" cy="50" r="23" stroke="#33647a" stroke-width=".3" fill="none"/><path d="M50 0V100 M0 50H100" stroke="#245168" stroke-width=".2"/></svg><div id="planes"></div><div id="center">⊕</div><div id="count">10 mi radius</div></section><aside id="details"><img id="photo" alt="Aircraft photo"/><h2 id="flight">Waiting for aircraft</h2><p id="type">Automatically tracks nearest aircraft</p><div id="stats"></div><p class="muted" id="notice">Aircraft data may be delayed or unavailable. Photo coverage varies.</p></aside></main><script>
const center={lat:25.7016,lon:-80.3580};let lastHex='';const $=x=>document.getElementById(x);function hav(a,b,c,d){const R=3958.8,rad=Math.PI/180,dl=(c-a)*rad,do_=(d-b)*rad,x=Math.sin(dl/2)**2+Math.cos(a*rad)*Math.cos(c*rad)*Math.sin(do_/2)**2;return 2*R*Math.asin(Math.sqrt(x))}function receive(raw){try{if(!raw)throw Error('network');let j=JSON.parse(raw),arr=(j.ac||[]).filter(a=>Number.isFinite(a.lat)&&Number.isFinite(a.lon)).map(a=>({...a,d:hav(center.lat,center.lon,a.lat,a.lon)})).filter(a=>a.d<=10).sort((a,b)=>a.d-b.d);$('planes').innerHTML='';arr.forEach((a,i)=>{let e=document.createElement('div');e.className='plane'+(i===0?' selected':'');e.textContent='✈';let dx=(a.lon-center.lon)*Math.cos(center.lat*Math.PI/180)*69.0,dy=(a.lat-center.lat)*69.0;e.style.left=(50+dx/10*46)+'%';e.style.top=(50-dy/10*46)+'%';e.style.transform='translate(-50%,-50%) rotate('+((a.track||0)-90)+'deg)';$('planes').appendChild(e)});$('status').textContent=arr.length+' aircraft · updated '+new Date().toLocaleTimeString();if(!arr.length){$('flight').textContent='No aircraft within 10 miles';$('stats').innerHTML='';return}let a=arr[0],hex=(a.hex||'').replace('~','');$('flight').textContent=(a.flight||a.r||a.hex||'Unknown').trim();$('type').textContent=[a.t,a.desc].filter(Boolean).join(' · ')||'Aircraft type unavailable';let rows=[['Distance',a.d.toFixed(1)+' mi'],['Altitude',a.alt_baro==='ground'?'Ground':Number.isFinite(a.alt_baro)?a.alt_baro.toLocaleString()+' ft':'Unknown'],['Speed',Number.isFinite(a.gs)?Math.round(a.gs)+' knots':'Unknown'],['Heading',Number.isFinite(a.track)?Math.round(a.track)+'°':'Unknown'],['Registration',a.r||'Unknown'],['ICAO',a.hex||'Unknown']];$('stats').innerHTML=rows.map(r=>'<div class="stat"><span class="muted">'+r[0]+'</span><strong>'+String(r[1]).replace(/[&<>]/g,'')+'</strong></div>').join('');if(hex!==lastHex){lastHex=hex;$('photo').removeAttribute('src');if(/^[a-fA-F0-9]{6}$/.test(hex))Native.photo(hex)}}catch(e){$('status').textContent='Live feed unavailable · retrying';}}
function receivePhoto(raw){try{let j=JSON.parse(raw),p=j.photos&&j.photos[0],url=p&&(p.thumbnail_large&&p.thumbnail_large.src||p.thumbnail&&p.thumbnail.src);if(url&&url.startsWith('https://'))$('photo').src=url}catch(e){}}Native.refresh();setInterval(()=>Native.refresh(),30000);
</script></body></html>
